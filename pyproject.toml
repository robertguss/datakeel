[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "datakeel"
dynamic = ["version"]
description = "Blazing-fast, agent-first (DX + AX) Rust data contract, schema drift, and codegen CLI with native ODCS v3 support."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Robert Guss" }]
requires-python = ">=3.9"
keywords = ["data-contracts", "odcs", "data-quality", "schema-drift", "etl", "postgres", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/robertguss/datakeel"
Repository = "https://github.com/robertguss/datakeel"
Issues = "https://github.com/robertguss/datakeel/issues"

[tool.maturin]
bindings = "bin"
features = ["vendored-tls"]
compatibility = "pypi"
strip = true
